<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSSTech Laundry v6 - Full Features</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }

        function switchTab(tab) {
            ['input', 'data', 'history'].forEach(t => {
                document.getElementById('view-' + t).style.display = 'none';
                document.getElementById('tab-' + t).className = 'tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px] tracking-widest';
            });
            document.getElementById('view-' + tab).style.display = 'block';
            document.getElementById('tab-' + tab).className = 'tab-btn flex-1 p-4 text-center border-blue-600 text-blue-600 font-black uppercase text-[10px] tracking-widest border-b-4';
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('darkIcon').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Auto Load Theme
        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('darkIcon').innerText = '☀️';
            }
        };
    </script>
    <style>
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        input, textarea { font-size: 16px !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

    <!-- NAV BAR -->
    <nav class="bg-blue-800 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="font-black text-xl italic tracking-tighter uppercase">MSSTECH <span class="font-light text-blue-300 text-sm">Laundry</span></div>
        <button onclick="toggleDarkMode()" class="p-2 bg-blue-900 rounded-xl active:scale-90 transition">
            <span id="darkIcon">🌙</span>
        </button>
    </nav>

    <!-- TABS MENU -->
    <div class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 sticky top-[60px] z-40 flex">
        <button onclick="switchTab('input')" id="tab-input" class="tab-btn flex-1 p-4 text-center border-blue-600 text-blue-600 font-black border-b-4 uppercase text-[10px] tracking-widest">INPUT</button>
        <button onclick="switchTab('data')" id="tab-data" class="tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px] tracking-widest">AKTIF</button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px] tracking-widest">HISTORY</button>
    </div>

    <main class="max-w-xl mx-auto p-4">
        
        <!-- SECTION: INPUT -->
        <section id="view-input">
            <div class="bg-white dark:bg-gray-800 p-6 rounded-[2.5rem] card-shadow border dark:border-gray-700">
                <form id="laundryForm" class="space-y-4">
                    <input type="text" id="custName" placeholder="Nama Pelanggan" required class="w-full p-4 rounded-2xl border dark:bg-gray-700 dark:border-gray-600 outline-none focus:ring-2 ring-blue-500">
                    <input type="tel" id="custPhone" placeholder="Nomor WhatsApp" required class="w-full p-4 rounded-2xl border dark:bg-gray-700 dark:border-gray-600 outline-none">
                    <textarea id="custAddr" placeholder="Alamat Lengkap" rows="2" class="w-full p-4 rounded-2xl border dark:bg-gray-700 dark:border-gray-600 outline-none"></textarea>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-2xl border dark:border-gray-600 text-center">
                            <label class="block text-[10px] font-black text-gray-400 uppercase">Berat (Kg)</label>
                            <input type="number" id="weight" step="0.1" value="0" required class="bg-transparent text-center font-black text-2xl w-full outline-none">
                        </div>
                        <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-2xl border dark:border-gray-600 text-center">
                            <label class="block text-[10px] font-black text-gray-400 uppercase">Jumlah (Pcs)</label>
                            <input type="number" id="itemQty" value="0" required class="bg-transparent text-center font-black text-2xl w-full outline-none">
                        </div>
                    </div>

                    <div id="photoGrid" class="flex flex-wrap gap-2 pt-2"></div>
                    <button type="button" onclick="document.getElementById('photoInput').click()" class="w-full p-4 border-2 border-dashed border-blue-400 rounded-2xl text-blue-600 font-bold uppercase text-xs">+ Foto Pakaian</button>
                    <input type="file" id="photoInput" accept="image/*" capture="camera" class="hidden">

                    <button type="submit" id="btnSubmit" class="w-full bg-blue-800 text-white p-5 rounded-3xl font-black text-lg active:scale-95 transition-transform shadow-lg shadow-blue-200 dark:shadow-none">SIMPAN & CETAK</button>
                </form>
            </div>
        </section>

        <!-- SECTION: DATA AKTIF -->
        <section id="view-data" style="display: none;">
            <div id="activeList" class="space-y-4">
                <p class="text-center text-gray-400 py-10 text-xs">Memuat data aktif...</p>
            </div>
        </section>

        <!-- SECTION: HISTORY -->
        <section id="view-history" style="display: none;">
            <div id="historyList" class="space-y-4 opacity-75">
                <p class="text-center text-gray-400 py-10 text-xs">Memuat riwayat bulan ini...</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDh67AJsHef2zFpdUQ-mJnMLQA2aGGOJzM",
            authDomain: "laundry-8e157.firebaseapp.com",
            projectId: "laundry-8e157",
            storageBucket: "laundry-8e157.firebasestorage.app",
            messagingSenderId: "723077475450",
            appId: "1:723077475450:web:a4191e0d24918b9f731fc3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let photoList = [];

        // HANDLER FOTO
        document.getElementById('photoInput').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.src = ev.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400; canvas.height = img.height * (400 / img.width);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    photoList.push(canvas.toDataURL('image/jpeg', 0.6));
                    renderPhotos();
                };
            };
            reader.readAsDataURL(file);
        };
        function renderPhotos() {
            document.getElementById('photoGrid').innerHTML = photoList.map((p, i) => `
                <div class="relative"><img src="${p}" class="w-16 h-16 object-cover rounded-xl border-2 border-blue-500 shadow-sm">
                <button type="button" onclick="window.delPhoto(${i})" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 text-[10px]">✕</button></div>
            `).join('');
        }
        window.delPhoto = (i) => { photoList.splice(i,1); renderPhotos(); };

        // SAVE DATA
        document.getElementById('laundryForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            if(photoList.length === 0) return alert("Wajib lampirkan foto!");
            btn.disabled = true; btn.innerText = "SIMPAN...";

            const payload = {
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddr: document.getElementById('custAddr').value,
                weight: parseFloat(document.getElementById('weight').value),
                itemQty: parseInt(document.getElementById('itemQty').value),
                totalPrice: parseFloat(document.getElementById('weight').value) * 6000,
                photos: photoList,
                isArchived: 0,
                timestamp: serverTimestamp()
            };

            try {
                const ref = await addDoc(collection(db, "orders"), payload);
                window.printInvoice({...payload, id: ref.id, dateStr: new Date().toLocaleString('id-ID')});
                e.target.reset(); photoList = []; renderPhotos();
                switchTab('data');
            } catch (err) { alert("Error: " + err.message); }
            finally { btn.disabled = false; btn.innerText = "SIMPAN & CETAK"; }
        };

        // REALTIME LISTENER
        const startOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

        // Tab Aktif (Tanpa filter tanggal agar data lama yang belum selesai tetap muncul)
        onSnapshot(query(collection(db, "orders"), where("isArchived", "==", 0)), (snap) => {
            const list = document.getElementById('activeList');
            list.innerHTML = snap.empty ? "<p class='text-center py-20 text-gray-400 uppercase text-[10px] font-black'>Tidak ada cucian aktif</p>" : "";
            const docs = [];
            snap.forEach(s => docs.push({id: s.id, ...s.data()}));
            docs.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            docs.forEach(d => list.innerHTML += renderCard(d, false));
        });

        // Tab History (Filter bulan berjalan)
        onSnapshot(query(collection(db, "orders"), where("isArchived", "==", 1), where("timestamp", ">=", startOfMonth)), (snap) => {
            const list = document.getElementById('historyList');
            list.innerHTML = snap.empty ? "<p class='text-center py-20 text-gray-400 uppercase text-[10px] font-black'>Riwayat bulan ini kosong</p>" : "";
            const docs = [];
            snap.forEach(s => docs.push({id: s.id, ...s.data()}));
            docs.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            docs.forEach(d => list.innerHTML += renderCard(d, true));
        });

        function renderCard(d, isHistory) {
            const tgl = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleString('id-ID') : 'Baru saja...';
            return `
            <div class="bg-white dark:bg-gray-800 p-5 rounded-[2rem] border dark:border-gray-700 shadow-sm mb-4">
                <div class="flex justify-between items-start mb-3 border-b dark:border-gray-700 pb-2">
                    <div><b class="text-blue-700 dark:text-blue-400 uppercase text-xs font-black">${d.customerName}</b><p class="text-[9px] text-gray-400">${tgl}</p></div>
                    <div class="text-right font-black text-lg">Rp ${d.totalPrice.toLocaleString()}</div>
                </div>
                <div class="text-[10px] text-gray-500 dark:text-gray-400 italic mb-3">📍 ${d.customerAddr || 'Tanpa alamat'}</div>
                <div class="grid grid-cols-4 gap-2 mb-4">${d.photos.map(p => `<img src="${p}" class="w-full h-16 object-cover rounded-xl shadow-sm">`).join('')}</div>
                <div class="flex gap-2">
                    <button onclick='window.printInvoice(${JSON.stringify(d)})' class="flex-1 bg-gray-100 dark:bg-gray-700 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Nota</button>
                    ${!isHistory ? `<button onclick="window.selesai('${d.id}')" class="flex-[2] bg-blue-600 text-white py-3 rounded-xl text-[10px] font-black uppercase shadow-lg shadow-blue-100 dark:shadow-none">Selesai</button>` : ''}
                </div>
            </div>`;
        }

        window.selesai = async (id) => { 
            if(confirm("Selesaikan pesanan ini?")) await updateDoc(doc(db, "orders", id), {isArchived: 1}); 
        };

        window.printInvoice = (d) => {
            const tgl = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleString('id-ID') : '...';
            const w = window.open('', '_blank');
            w.document.write(`<html><head><style>
                body{font-family:'Courier New',monospace;width:140mm;padding:8mm;}
                .hr{border-bottom:1px dashed #000;margin:8px 0;}
                .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
                img{width:100%;height:100px;object-fit:cover;border:1px solid #eee;}
            </style></head>
            <body>
                <center><h3>MSSTECH LAUNDRY</h3></center>
                <div class="hr"></div>
                <pre style="font-size:12px;">
PLG : ${d.customerName}
WA  : ${d.customerPhone}
ALM : ${d.customerAddr || '-'}
TGL : ${tgl}
---------------------------
BERAT : ${d.weight} KG
JUMLAH: ${d.itemQty} PCS
TOTAL : Rp ${d.totalPrice.toLocaleString()}
---------------------------
</pre>
                <div class="grid">${d.photos.map(p=>`<img src="${p}">`).join('')}</div>
                <div class="hr"></div>
                <center><p style="font-size:10px;">Terima kasih!</p></center>
                <script>window.onload=function(){window.print();window.close();}<\/script>
            </body></html>`);
        };
    </script>
</body>
</html>
