<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maju Laundry Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        majulaundry: { 
                            navy: '#0a1d37', 
                            gold: '#ffb400', 
                            blue: '#1e40af',
                            // Menyesuaikan warna header dengan background putih logo
                            headerbg: '#ffffff' 
                        } 
                    }
                }
            }
        }

        function switchTab(tab) {
            ['input', 'data', 'history', 'archive', 'settings'].forEach(t => {
                const el = document.getElementById('view-' + t);
                if(el) el.style.display = 'none';
                const btn = document.getElementById('tab-' + t);
                if(btn) btn.className = 'tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px]';
            });
            
            const filterBar = document.getElementById('filterBar');
            filterBar.style.display = (tab === 'input' || tab === 'settings') ? 'none' : 'block';

            document.getElementById('view-' + tab).style.display = 'block';
            document.getElementById('tab-' + tab).className = 'tab-btn flex-1 p-4 text-center border-majulaundry-gold text-majulaundry-gold font-black uppercase text-[10px] border-b-4';
            
            if(window.applyFilters) window.applyFilters();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('darkIcon').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
    </script>
    <style>
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Maju Laundry Banner.jpeg');
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: -1;
        }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input, textarea { font-size: 16px !important; }
        .archive-card { transition: all 0.2s ease; }
        .archive-card:active { transform: scale(0.98); }
        .glass-container { backdrop-filter: blur(4px); }
        
        .header-logo {
            width: 100%;
            max-width: 320px;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-slate-100/50 dark:bg-gray-900/50 text-gray-900 dark:text-gray-100 min-h-screen">

    <nav class="bg-white dark:bg-gray-800 p-2 sticky top-0 z-50 border-b-2 border-majulaundry-gold shadow-lg">
        <div class="flex flex-col items-center justify-center relative min-h-[80px]">
            <img src="Maju Laundry Logo(1).jpg" alt="Logo" class="header-logo">
            <button onclick="toggleDarkMode()" class="absolute right-4 top-1/2 -translate-y-1/2 p-2 bg-slate-100 dark:bg-slate-700 rounded-xl border border-gray-300 dark:border-gray-600 active:scale-90 transition">
                <span id="darkIcon" class="dark:text-white">🌙</span>
            </button>
        </div>
    </nav>

    <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border-b dark:border-gray-700 sticky top-[98px] z-40 flex overflow-x-auto no-scrollbar">
        <button onclick="switchTab('input')" id="tab-input" class="tab-btn flex-1 p-4 text-center border-majulaundry-gold text-majulaundry-gold font-black border-b-4 uppercase text-[10px]">INPUT</button>
        <button onclick="switchTab('data')" id="tab-data" class="tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px]">AKTIF</button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px]">HISTORY</button>
        <button onclick="switchTab('archive')" id="tab-archive" class="tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px]">ARSIP</button>
        <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn flex-1 p-4 text-center border-transparent text-gray-400 font-bold uppercase text-[10px]">MASTER</button>
    </div>

    <main class="max-w-xl mx-auto p-4 pb-24 relative z-10 glass-container">
        
        <div id="filterBar" class="mb-4 space-y-2" style="display: none;">
            <div class="flex gap-2">
                <input type="text" id="searchInput" oninput="window.applyFilters()" placeholder="Cari Nama / HP..." class="flex-1 p-3 rounded-xl border dark:bg-gray-800 dark:border-gray-700 outline-none text-sm shadow-sm">
                <input type="date" id="filterDate" onchange="window.applyFilters()" class="p-2 rounded-xl border dark:bg-gray-800 text-xs shadow-sm">
                <button onclick="window.resetFilter()" class="bg-white dark:bg-gray-800 text-red-500 px-4 rounded-xl border font-bold">✕</button>
            </div>
        </div>

        <section id="view-input">
            <div class="bg-white/95 dark:bg-gray-800/95 p-6 rounded-[2rem] border-t-4 border-majulaundry-navy card-shadow">
                <form id="laundryForm" class="space-y-4">
                    <input type="text" id="custName" placeholder="Nama Pelanggan" required class="w-full p-4 rounded-2xl border dark:bg-gray-700 outline-none">
                    <input type="tel" id="custPhone" placeholder="Nomor WA" required class="w-full p-4 rounded-2xl border dark:bg-gray-700 outline-none">
                    <textarea id="custAddr" placeholder="Alamat" rows="1" class="w-full p-4 rounded-2xl border dark:bg-gray-700 outline-none"></textarea>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 dark:bg-gray-700 p-3 rounded-2xl text-center">
                            <label class="block text-[10px] font-black uppercase opacity-50">Berat (Kg)</label>
                            <input type="number" id="weight" step="0.1" value="0" oninput="calcTotal()" class="bg-transparent text-center font-black text-2xl w-full outline-none">
                        </div>
                        <div class="bg-slate-50 dark:bg-gray-700 p-3 rounded-2xl text-center">
                            <label class="block text-[10px] font-black uppercase opacity-50">Jumlah (Pcs)</label>
                            <input type="number" id="itemQty" value="0" class="bg-transparent text-center font-black text-2xl w-full outline-none">
                        </div>
                    </div>

                    <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl border border-blue-100 dark:border-blue-800 text-center">
                        <div id="estTotal" class="font-black text-2xl text-blue-600 dark:text-blue-400">Rp 0</div>
                    </div>

                    <div id="inputChecklistArea" class="grid grid-cols-2 gap-2"></div>
                    <textarea id="custNote" placeholder="Catatan..." rows="2" class="w-full p-4 rounded-2xl border dark:bg-gray-700 outline-none"></textarea>

                    <div id="photoGrid" class="flex flex-wrap gap-2"></div>
                    <button type="button" onclick="document.getElementById('photoInput').click()" class="w-full p-4 border-2 border-dashed border-majulaundry-navy rounded-2xl text-majulaundry-navy font-bold text-xs uppercase tracking-widest">+ FOTO</button>
                    <input type="file" id="photoInput" accept="image/*" capture="camera" class="hidden">

                    <button type="submit" id="btnSubmit" class="w-full bg-majulaundry-navy text-white p-5 rounded-3xl font-black text-lg shadow-lg uppercase tracking-wider">SIMPAN PESANAN</button>
                </form>
            </div>
        </section>

        <section id="view-data" style="display: none;"><div id="activeList" class="space-y-4"></div></section>
        
        <section id="view-history" style="display: none;">
            <div class="mb-4"><button onclick="window.archiveCurrentMonth()" class="w-full bg-majulaundry-gold text-majulaundry-navy py-4 rounded-2xl text-[10px] font-black shadow-md uppercase tracking-widest">Pindahkan ke Arsip Bulanan</button></div>
            <div id="historyList" class="space-y-4"></div>
        </section>

        <section id="view-archive" style="display: none;">
            <div class="grid grid-cols-1 gap-3" id="archiveMonthsList"></div>
            <div id="archiveItems" class="space-y-4 mt-6 border-t-2 border-dashed border-gray-300 dark:border-gray-700 pt-6" data-current-folder=""></div>
        </section>

        <section id="view-settings" style="display: none;">
            <div class="bg-white/90 dark:bg-gray-800/90 p-6 rounded-2xl border-t-4 border-majulaundry-gold card-shadow">
                <div class="flex gap-2 mb-6">
                    <input type="text" id="masterInput" placeholder="Nama Layanan..." class="flex-1 p-3 rounded-xl border dark:bg-gray-700 outline-none">
                    <button onclick="addMasterItem()" class="bg-majulaundry-navy text-white px-6 rounded-xl font-bold">+</button>
                </div>
                <div id="masterList" class="space-y-2"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, doc, updateDoc, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDh67AJsHef2zFpdUQ-mJnMLQA2aGGOJzM",
            authDomain: "laundry-8e157.firebaseapp.com",
            projectId: "laundry-8e157",
            storageBucket: "laundry-8e157.firebasestorage.app",
            messagingSenderId: "723077475450",
            appId: "1:723077475450:web:a4191e0d24918b9f731fc3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allDataCache = [];
        let masterChecklist = JSON.parse(localStorage.getItem('masterChecklist')) || ["Cuci Setrika", "Cuci Kering"];

        window.applyFilters = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const date = document.getElementById('filterDate').value;
            const activeTab = document.querySelector('.tab-btn.border-majulaundry-gold')?.id.replace('tab-', '') || 'data';
            
            let targetId = "activeList";
            if(activeTab === "history") targetId = "historyList";
            if(activeTab === "archive") targetId = "archiveItems";

            const filtered = allDataCache.filter(d => {
                const isActive = (d.status === 'active' || (!d.status && !d.isArchived));
                const isHistory = (d.status === 'history' || (d.isArchived === 1 && d.status !== 'archived'));
                const isArchived = (d.status === 'archived');

                const matchTab = (activeTab === 'data' && isActive) || (activeTab === 'history' && isHistory) || (activeTab === 'archive' && isArchived);
                const matchSearch = !search || d.customerName?.toLowerCase().includes(search) || d.customerPhone?.includes(search);
                
                let matchDate = true;
                if(date && d.timestamp) {
                    const dDate = new Date(d.timestamp.seconds * 1000).toISOString().split('T')[0];
                    matchDate = dDate === date;
                }
                return matchTab && matchSearch && matchDate;
            });

            const list = document.getElementById(targetId);
            if(list) {
                list.innerHTML = filtered.length ? "" : "<div class='text-center py-20 opacity-30 font-black uppercase text-xs'>Data Kosong</div>";
                filtered.forEach(d => list.innerHTML += renderCard(d));
            }
        };

        window.resetFilter = () => {
            document.getElementById('searchInput').value = "";
            document.getElementById('filterDate').value = "";
            window.applyFilters();
        };

        onSnapshot(collection(db, "orders"), (snap) => {
            allDataCache = snap.docs.map(s => ({ id: s.id, ...s.data() })).sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            window.applyFilters();
            renderArchiveFoldersUI();
        });

        function renderCard(d) {
            const isHistory = (d.status === 'history' || (d.isArchived === 1 && d.status !== 'archived'));
            const isArchived = (d.status === 'archived');
            const tgl = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : '...';
            const dataStr = encodeURIComponent(JSON.stringify(d));

            return `
            <div class="bg-white/95 dark:bg-gray-800/95 p-5 rounded-[2rem] border-l-8 border-majulaundry-navy shadow-sm mb-3">
                <div class="flex justify-between items-start border-b dark:border-gray-700 pb-3 mb-3">
                    <div>
                        <b class="text-majulaundry-navy dark:text-majulaundry-gold uppercase text-[12px] font-black">${d.customerName}</b>
                        <p class="text-[10px] text-green-600 font-bold">${d.customerPhone} • ${tgl}</p>
                    </div>
                    <div class="text-right font-black text-sm">Rp ${(d.totalPrice || 0).toLocaleString()}</div>
                </div>
                <div class="flex flex-wrap gap-1 mb-2">${(d.selectedItems || []).map(i => `<span class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 text-[8px] px-2 py-1 rounded-md font-bold uppercase tracking-tight">✓ ${i}</span>`).join('')}</div>
                <div class="text-[9px] text-gray-500 italic mb-4 opacity-70 leading-tight">🏠 ${d.customerAddr || '-'} | 📝 ${d.note || '-'}</div>
                <div class="grid grid-cols-4 gap-1 mb-4">${(d.photos || []).map(p => `<img src="${p}" class="w-full h-12 rounded-xl object-cover border dark:border-gray-700 shadow-sm">`).join('')}</div>
                <div class="flex gap-2">
                    <button onclick="window.printThermal('${dataStr}')" class="flex-1 bg-slate-100 dark:bg-gray-700 py-3 rounded-2xl text-[9px] font-black uppercase flex items-center justify-center gap-1 shadow-sm">
                        <span>🖨️</span> PRINT NOTA
                    </button>
                    ${(!isHistory && !isArchived) ? `<button onclick="window.updateStatus('${d.id}', 'history')" class="flex-[1.5] bg-majulaundry-navy text-white py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest shadow-md">SELESAI</button>` : ''}
                    ${isHistory ? `<button onclick="window.updateStatus('${d.id}', 'active')" class="flex-1 bg-gray-200 dark:bg-gray-600 py-3 rounded-2xl text-[9px] font-black uppercase italic shadow-sm">EDIT</button>` : ''}
                    ${isArchived ? `<button onclick="window.updateStatus('${d.id}', 'active')" class="flex-1 bg-majulaundry-gold text-majulaundry-navy py-3 rounded-2xl text-[9px] font-black uppercase shadow-sm">RESTORE</button>` : ''}
                </div>
            </div>`;
        }

        window.printThermal = (dataEncoded) => {
            const d = JSON.parse(decodeURIComponent(dataEncoded));
            const tgl = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleString('id-ID') : '-';
            const w = window.open('', '_blank');
            w.document.write(`
                <html>
                <head>
                    <style>
                        body { font-family: 'Courier New', Courier, monospace; width: 58mm; font-size: 10px; padding: 5px; margin: 0; }
                        .center { text-align: center; }
                        .hr { border-bottom: 1px dashed #000; margin: 5px 0; }
                        .bold { font-weight: bold; }
                        .total { font-size: 14px; font-weight: bold; margin-top: 5px; }
                        img.receipt-logo { width: 45mm; display: block; margin: 0 auto 5px; }
                        img.photo { width: 100%; height: 50px; object-fit: cover; margin-top: 2px; }
                        .grid { display: grid; grid-template-cols: 1fr 1fr; gap: 2px; }
                    </style>
                </head>
                <body>
                    <div class="center">
                        <img src="Maju Laundry Logo(1).jpg" class="receipt-logo">
                        <p style="font-size:8px; margin:2px 0;">Bogor</p>
                    </div>
                    <div class="hr"></div>
                    <p>TGL: ${tgl}<br>NAMA: ${d.customerName}<br>WA  : ${d.customerPhone}</p>
                    <div class="hr"></div>
                    <p class="bold">LAYANAN:</p>
                    <p>${(d.selectedItems || []).join(', ')}</p>
                    <p>BERAT : ${d.weight} Kg<br>JUMLAH: ${d.itemQty} Pcs</p>
                    <div class="hr"></div>
                    <div class="total center text-lg">TOTAL: Rp ${(d.totalPrice || 0).toLocaleString()}</div>
                    <div class="hr"></div>
                    <p class="center" style="font-size:8px">DOKUMENTASI:</p>
                    <div class="grid">${(d.photos || []).map(p => `<img src="${p}" class="photo">`).join('')}</div>
                    <div class="hr"></div>
                    <p class="center" style="font-size:8px">Terima kasih atas kepercayaan Anda!</p>
                    <script>window.onload=function(){window.print();setTimeout(()=>window.close(),500);}<\/script>
                </body>
                </html>
            `);
            w.document.close();
        };

        function renderArchiveFoldersUI() {
            const archived = allDataCache.filter(d => d.status === 'archived');
            const groups = archived.reduce((acc, d) => {
                const m = d.monthFolder || 'Lainnya';
                acc[m] = (acc[m] || 0) + 1;
                return acc;
            }, {});
            const list = document.getElementById('archiveMonthsList');
            if(!list) return;
            const months = Object.keys(groups).sort().reverse();
            list.innerHTML = months.map(m => `
                <div onclick="window.toggleFolder('${m}')" class="archive-card bg-white dark:bg-gray-800 p-5 rounded-3xl border-b-4 border-gray-200 dark:border-gray-700 flex justify-between items-center shadow-sm cursor-pointer">
                    <div class="flex items-center gap-4">
                        <div class="bg-majulaundry-navy text-white w-10 h-10 rounded-2xl flex items-center justify-center font-black">📁</div>
                        <div>
                            <h4 class="font-black text-xs uppercase tracking-wider">Arsip Bulan ${m}</h4>
                            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter">${groups[m]} Transaksi</p>
                        </div>
                    </div>
                    <span id="icon-${m}" class="text-majulaundry-gold font-black transition-transform">▼</span>
                </div>`).join('');
        }

        window.toggleFolder = (m) => {
            const list = document.getElementById('archiveItems');
            const icon = document.getElementById(`icon-${m}`);
            if (list.getAttribute('data-current-folder') === m) {
                list.innerHTML = "";
                list.setAttribute('data-current-folder', "");
                if(icon) icon.style.transform = "rotate(0deg)";
            } else {
                const filtered = allDataCache.filter(d => d.status === 'archived' && d.monthFolder === m);
                list.innerHTML = `<div class="flex justify-between items-center mb-4 px-2 font-black text-[10px] uppercase text-majulaundry-navy dark:text-majulaundry-gold"><span>Folder: ${m}</span><button onclick="window.toggleFolder('${m}')" class="text-red-500">Tutup X</button></div>`;
                filtered.forEach(d => list.innerHTML += renderCard(d));
                list.setAttribute('data-current-folder', m);
                if(icon) icon.style.transform = "rotate(180deg)";
                list.scrollIntoView({ behavior: 'smooth' });
            }
        };

        window.updateStatus = async (id, newStatus) => {
            await updateDoc(doc(db, "orders", id), { status: newStatus, isArchived: newStatus === 'active' ? 0 : 1 });
        };

        window.archiveCurrentMonth = async () => {
            const historyData = allDataCache.filter(d => (d.status === 'history' || d.isArchived === 1) && d.status !== 'archived');
            if(historyData.length === 0) return alert("Menu History sudah kosong.");
            if(!confirm(`Arsipkan ${historyData.length} data?`)) return;
            const batch = writeBatch(db);
            const now = new Date();
            const folder = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
            historyData.forEach(d => {
                batch.update(doc(db, "orders", d.id), { status: 'archived', isArchived: 1, monthFolder: folder });
            });
            await batch.commit();
            alert("Berhasil!");
        };

        window.calcTotal = () => {
            const w = parseFloat(document.getElementById('weight').value) || 0;
            document.getElementById('estTotal').innerText = "Rp " + (w * 6000).toLocaleString('id-ID');
        };

        window.saveMaster = () => { localStorage.setItem('masterChecklist', JSON.stringify(masterChecklist)); renderMasterUI(); renderInputChecklistUI(); };
        window.addMasterItem = () => { const v = document.getElementById('masterInput').value; if(v){ masterChecklist.push(v); document.getElementById('masterInput').value=""; saveMaster(); } };
        window.deleteMasterItem = (i) => { if(confirm("Hapus?")){ masterChecklist.splice(i,1); saveMaster(); } };
        function renderMasterUI() { document.getElementById('masterList').innerHTML = masterChecklist.map((item, i) => `<div class="flex items-center gap-2 bg-slate-50 dark:bg-gray-700 p-3 rounded-xl border dark:border-gray-600"><span class="flex-1 font-bold text-sm uppercase">${item}</span><button onclick="deleteMasterItem(${i})" class="text-red-500 px-3 font-bold">✕</button></div>`).join(''); }
        function renderInputChecklistUI() { document.getElementById('inputChecklistArea').innerHTML = masterChecklist.map(item => `<label class="flex items-center gap-2 bg-white/80 dark:bg-gray-800/80 p-4 rounded-2xl border dark:border-gray-700 text-[10px] font-black uppercase cursor-pointer active:bg-slate-100"><input type="checkbox" name="laundry_item" value="${item}" class="w-4 h-4 accent-majulaundry-navy"> ${item}</label>`).join(''); }
        
        let photoList = [];
        document.getElementById('photoInput').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image(); img.src = ev.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400; canvas.height = img.height * (400 / img.width);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    photoList.push(canvas.toDataURL('image/jpeg', 0.6));
                    renderPhotos();
                };
            };
            reader.readAsDataURL(file);
        };
        function renderPhotos() { document.getElementById('photoGrid').innerHTML = photoList.map((p, i) => `<div class="relative"><img src="${p}" class="w-16 h-16 rounded-xl border-2 border-majulaundry-navy object-cover shadow-sm"></div>`).join(''); }

        document.getElementById('laundryForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerText = "SIMPAN...";
            try {
                await addDoc(collection(db, "orders"), {
                    customerName: document.getElementById('custName').value,
                    customerPhone: document.getElementById('custPhone').value,
                    customerAddr: document.getElementById('custAddr').value,
                    selectedItems: Array.from(document.querySelectorAll('input[name="laundry_item"]:checked')).map(el => el.value),
                    weight: parseFloat(document.getElementById('weight').value) || 0,
                    itemQty: parseInt(document.getElementById('itemQty').value) || 0,
                    totalPrice: (parseFloat(document.getElementById('weight').value) || 0) * 6000,
                    photos: photoList,
                    status: 'active',
                    isArchived: 0,
                    timestamp: serverTimestamp()
                });
                e.target.reset(); photoList = []; renderPhotos(); switchTab('data');
            } catch (err) { alert(err.message); } finally { btn.disabled = false; btn.innerText = "SIMPAN PESANAN"; }
        };

        renderMasterUI(); 
        renderInputChecklistUI();
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('darkIcon').innerText = '☀️';
        }
    </script>
</body>
</html>
